<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="capacitor.js"></script>
</head>
<body>
<!-- app:start — 이 아래부터 app:end 까지가 웹 버전(아티팩트)과 공유하는 앱 본문이에요 -->
<title>초록 하루</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Static brand bar on top, scrolling main, bottom tab bar.
   White ground; green is reserved for state (done) and the one primary action. */
:root{
  --bg:#ffffff; --surface:#f4f8f5; --surface-2:#e8f1ea; --line:#d9e5dc;
  --fg:#182319; --muted:#647263;
  --green:#1e8a4b; --green-deep:#156636; --green-soft:#def2e4; --green-ink:#0d3b21;
  --amber:#a86f12; --amber-soft:#fbf0d9;
  --red:#b93a2f; --red-soft:#fae3df;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
  --shadow:0 1px 2px rgba(20,40,25,.05),0 8px 20px rgba(20,40,25,.07);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
input:not([type=checkbox]):not([type=radio]),textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-width:0}
textarea{resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
small{font-size:12.5px}
[hidden]{display:none!important}
html:not(.native) .native-only{display:none!important}
html.native .web-only{display:none!important}

/* top bar */
.top{border-bottom:1px solid var(--line);background:var(--bg);flex:none;padding-block:10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--green);display:inline-grid;place-items:center;color:#fff}
.brand i svg{width:14px;height:14px}
.pill{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--green-soft);color:var(--green-ink);font-weight:500;white-space:nowrap}

/* banners */
#banners{flex:none;background:var(--amber-soft);border-bottom:1px solid #f0dcae}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;font-size:14px;color:#5c3d05}
.banner+.banner{border-top:1px solid #f0dcae}

/* main */
main{flex:1;min-height:0;overflow-y:auto;padding-block:14px 28px}
body.noscroll main{overflow:hidden}
.date{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25}
.sub{color:var(--muted);margin-top:2px;margin-bottom:14px}
.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:20px 0 8px;display:flex;align-items:center;gap:6px}
.sec .cnt{font-weight:500;background:var(--surface-2);border-radius:999px;padding:0 7px;font-size:11.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card h3{font-size:14px;font-weight:600;margin-bottom:8px}
.note{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;background:var(--surface)}
.note.warn{background:var(--amber-soft);color:#5c3d05}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:6px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0}
.status i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.status i.off{background:var(--amber)}
a.chip{text-decoration:none;display:inline-block;color:inherit}

/* welcome */
.welcome{background:var(--green-soft);border:0}
.welcome h3{color:var(--green-ink)}
.welcome p{font-size:13.5px;color:var(--green-ink);margin-bottom:10px}

/* summary */
.summary{background:var(--surface);border-color:transparent}
.summary .row{display:flex;align-items:baseline;justify-content:space-between}
.summary .num{font-size:26px;font-weight:600;color:var(--green-deep)}
.summary .num small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.summary .ok{margin-top:8px;color:var(--green-deep);font-size:13.5px;font-weight:500}

/* missed */
.missed{background:var(--amber-soft);border-color:transparent}
.missed h3{color:#5c3d05}
.duerow{display:flex;gap:10px;font-size:14px;padding:3px 0;color:#5c3d05}
.duerow .t{font-weight:600;min-width:46px}

/* habit card */
.hcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.hcard.is-done{background:var(--green-soft);border-color:transparent}
.hhead{display:flex;align-items:center;gap:10px}
.emoji{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}
.is-done .emoji{background:#fff}
.hname{flex:1;min-width:0}
.hname b{font-weight:600;display:block;line-height:1.3}
.hname small{color:var(--muted);display:block}
.hprog{font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
.is-done .hprog{color:var(--green-deep)}
.hbody{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.small{gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;background:#fff;font-weight:500;line-height:1.3}
.chips.small .chip{padding:5px 11px;font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.danger{color:var(--red);border-color:#efc9c4}
.chip.confirming,.btn.confirming{background:var(--red);border-color:var(--red);color:#fff}
.bigcheck{width:100%;border:1.5px dashed var(--line);border-radius:11px;padding:10px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.bigcheck.on{border-style:solid;border-color:var(--green);background:var(--green);color:#fff}
.bigcheck .ck{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:12px}
.countform{display:flex;gap:8px;align-items:center;margin-top:8px}
.countform input{flex:1}
.countform .unit{color:var(--muted);font-size:13.5px}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.quick .link{margin-left:auto}
.logrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.logrow input[type=time]{width:auto;flex:none}
.logs{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.logs div{display:flex;gap:10px;align-items:center;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
.logs .t{color:var(--muted);min-width:44px}
.logs .x{margin-left:auto;color:var(--muted);padding:2px 8px}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;background:#fff;white-space:nowrap}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn.danger-ghost{color:var(--red);border-color:#efc9c4}
.link{color:var(--green-deep);font-weight:500;font-size:13.5px;padding:4px 6px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

/* events */
.evlist{display:flex;flex-direction:column;gap:6px}
.evrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.evrow.done{opacity:.6}
.evrow.done b{text-decoration:line-through}
.evrow .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;color:#fff}
.evrow .ck.on{background:var(--green);border-color:var(--green)}
.evtxt{flex:1;min-width:0}
.evtxt b{font-weight:600;display:block}
.evtxt small{color:var(--muted);display:block}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead h1{font-size:20px}
.calhead .nav{display:flex;gap:4px;align-items:center}
.calhead .nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.calhead .nav .link{width:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0 6px;font-weight:500}
.dow:first-child{color:#c0574c}
.day{aspect-ratio:1/1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.day.sel{background:var(--surface)}
.day.today .dn{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--green)}
.day.future{opacity:.5}
.dn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:500;background:transparent}
.dn.part{background:conic-gradient(var(--green) var(--deg),var(--surface-2) 0)}
.dn.part>span,.dn>span{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center}
.dn.full{background:var(--green)}
.dn.full>span{background:var(--green);color:#fff;font-weight:600}
.evdot{width:5px;height:5px;border-radius:50%;background:var(--amber)}
.evdot.done{background:var(--line)}
.calsum{color:var(--muted);font-size:13px;margin:8px 0 2px;display:flex;gap:12px;flex-wrap:wrap}
.legend{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.panel{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.panel .ph h2{font-size:17px;font-weight:600}

/* manage */
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mrow .hname small{white-space:normal}
.mactions{display:flex;gap:2px;flex:none}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.iconbtn:disabled{opacity:.3}
.iconbtn.danger{color:var(--red)}
.iconbtn.bell.on{color:var(--green-deep);background:var(--green-soft)}
.iconbtn.confirming{background:var(--red);color:#fff;width:auto;padding:0 10px;font-size:12.5px}
.addbtn{width:100%;border:1.5px dashed var(--green);border-radius:12px;padding:12px;color:var(--green-deep);font-weight:600;margin-bottom:12px;background:var(--green-soft)}

/* settings */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:14.5px}
.switchrow small{display:block;color:var(--muted);font-size:12px}
.switchrow input{width:20px;height:20px;accent-color:var(--green);flex:none}
.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.7}
#restore-form{margin-top:8px}
#restore-form .actions{margin-top:6px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(15,30,20,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet>form{max-width:560px;margin:0 auto}
.sheet h2{font-size:18px;font-weight:600;margin-bottom:12px}
.field{display:block;margin-bottom:12px}
.field>span,.field>label>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.frow{display:flex;gap:10px}
.frow .grow{flex:1;min-width:0}
.frow .icon{width:84px;flex:none}
.seg{display:flex;flex-direction:column;gap:6px}
.segopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.segopt input{accent-color:var(--green);width:18px;height:18px;margin:0}
.segopt b{font-weight:600;display:block;font-size:14px}
.segopt small{color:var(--muted);display:block}
.segopt:has(input:checked){border-color:var(--green);background:var(--green-soft)}
.slotrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.slotrow input[type=time]{width:auto;flex:none}
.days{display:flex;gap:6px}
.daychip{flex:1}
.daychip input{position:absolute;opacity:0;width:0;height:0}
.daychip span{display:block;text-align:center;border:1px solid var(--line);border-radius:9px;padding:8px 0;font-size:13.5px;font-weight:500}
.daychip input:checked+span{background:var(--green);border-color:var(--green);color:#fff}
.daychip input:focus-visible+span{outline:2px solid var(--green);outline-offset:1px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;align-items:center}
.actions .sp{flex:1}

/* tabs */
.tabs{flex:none;border-top:1px solid var(--line);background:var(--bg)}
.tabs .wrap{display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11.5px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--green-deep)}
.tab.on svg{stroke-width:2.2}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green-ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top gutter">
  <div class="wrap">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></i>초록 하루</div>
    <span class="pill" id="streak-pill">오늘도 초록하게</span>
  </div>
</header>
<div id="banners" class="gutter" hidden></div>
<main id="view" class="gutter"></main>
<nav class="tabs gutter" aria-label="화면 이동">
  <div class="wrap">
    <button class="tab on" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>오늘</button>
    <button class="tab" data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
    <button class="tab" data-act="tab" data-tab="manage"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>습관</button>
    <button class="tab" data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>설정</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var KEY='chorok-haru-v1';
var APK_URL='https://github.com/aanirri07-ai/aanirri/releases/latest';
var DOW=['일','월','화','수','목','금','토'];
var ALL=[0,1,2,3,4,5,6];
function noop(){}
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayStr(){return fmtDate(new Date());}
function nowHM(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
function toMin(hm){var p=hm.split(':').map(Number);return p[0]*60+p[1];}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);}
function fmtNum(n){return Number(n||0).toLocaleString('ko-KR');}
function kDate(s,withDow){var d=parseDate(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'+(withDow?' ('+DOW[d.getDay()]+')':'');}
function dday(s){var t=todayStr();var diff=Math.round((parseDate(s)-parseDate(t))/86400000);return diff===0?'오늘':diff===1?'내일':diff>0?'D-'+diff:(-diff)+'일 전';}
function byTime(a,b){return (a.time||'99').localeCompare(b.time||'99');}
function byDateTime(a,b){return a.date===b.date?byTime(a,b):a.date.localeCompare(b.date);}

/* ---------- state ---------- */
var state=null, storageOk=true;
function defaults(){return {v:1,habits:[],events:[],records:{},settings:{remind:true,sound:true,alarm:true,name:''},welcomed:false};}
function sample(){
  var t=todayStr();
  function mk(o){return Object.assign({id:uid(),emoji:'',type:'check',slots:[],target:1,unit:'',options:[],days:ALL.slice(),alarm:true,createdAt:t},o);}
  return {
    habits:[
      mk({name:'약 먹기',emoji:'💊',slots:[{label:'아침',time:'08:00'},{label:'저녁',time:'20:00'}]}),
      mk({name:'영양제',emoji:'🌿',slots:[{label:'아침',time:'08:30'}]}),
      mk({name:'식사',emoji:'🍚',type:'log',slots:[{label:'아침',time:'08:00'},{label:'점심',time:'12:30'},{label:'저녁',time:'18:30'}],target:3,options:['조금','보통','많이']}),
      mk({name:'걷기',emoji:'👟',type:'count',slots:[{label:'',time:'19:00'}],target:4000,unit:'보'})
    ],
    events:[{id:uid(),title:'병원 진료 (예시)',date:addDays(t,5),time:'10:00',note:'진료 카드, 먹는 약 목록 챙기기',done:false}]
  };
}
function normalize(){
  state.habits=(state.habits||[]).filter(function(h){return h&&h.id;});
  state.habits.forEach(function(h){h.slots=Array.isArray(h.slots)?h.slots:[];h.days=Array.isArray(h.days)&&h.days.length?h.days:ALL.slice();h.options=Array.isArray(h.options)?h.options:[];h.target=Number(h.target)||1;h.type=['check','count','log'].indexOf(h.type)>=0?h.type:'check';if(typeof h.alarm!=='boolean')h.alarm=true;});
  state.events=(state.events||[]).filter(function(e){return e&&e.id&&e.date;});
  state.records=state.records||{};
  state.settings=Object.assign(defaults().settings,state.settings||{});
}
function load(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOk=false;}
  if(raw){try{state=Object.assign(defaults(),JSON.parse(raw));normalize();return;}catch(e){}}
  state=defaults();var s=sample();state.habits=s.habits;state.events=s.events;normalize();save();
}
/* save(true): 습관·일정·설정처럼 알람에 영향을 주는 변경 → 알람도 다시 예약 */
function save(sync){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOk=false;} if(sync)syncAlarms();}

/* ---------- records ---------- */
function rec(date,hid){return (state.records[date]||{})[hid];}
function setRec(date,hid,val){
  if(!state.records[date])state.records[date]={};
  if(val==null)delete state.records[date][hid];else state.records[date][hid]=val;
  if(!Object.keys(state.records[date]).length)delete state.records[date];
  save();
}
function activeOn(h,date){
  var dow=parseDate(date).getDay();
  return h.days.indexOf(dow)>=0&&(!h.createdAt||h.createdAt<=date);
}
function progress(h,date){
  var r=rec(date,h.id);
  if(h.type==='check'){
    var total=Math.max(1,h.slots.length);
    var done=h.slots.filter(function(s){return r&&r[s.label];}).length;
    return {done:done,total:total,ratio:done/total,complete:done>=total,text:done+'/'+total};
  }
  if(h.type==='count'){
    var v=Number(r||0),t=h.target||1;
    return {done:v,total:t,ratio:Math.min(1,v/t),complete:v>=t,text:fmtNum(v)+' / '+fmtNum(t)+(h.unit||'')};
  }
  var arr=Array.isArray(r)?r:[],tt=h.target||1;
  return {done:arr.length,total:tt,ratio:Math.min(1,arr.length/tt),complete:arr.length>=tt,text:arr.length+'/'+tt+'회'};
}
function daySummary(date){
  var hs=state.habits.filter(function(h){return activeOn(h,date);});
  var done=hs.filter(function(h){return progress(h,date).complete;}).length;
  return {done:done,total:hs.length,ratio:hs.length?done/hs.length:0};
}
function habitStreak(h){
  var d=todayStr(),n=0;
  if(!progress(h,d).complete)d=addDays(d,-1);
  for(var i=0;i<400;i++){
    if(h.createdAt&&d<h.createdAt)break;
    if(!activeOn(h,d)){d=addDays(d,-1);continue;}
    if(progress(h,d).complete){n++;d=addDays(d,-1);}else break;
  }
  return n;
}
function overallStreak(){
  var d=todayStr(),n=0,s=daySummary(d);
  if(!(s.total&&s.done===s.total))d=addDays(d,-1);
  for(var i=0;i<400;i++){
    s=daySummary(d);
    if(!s.total)break;
    if(s.done===s.total){n++;d=addDays(d,-1);}else break;
  }
  return n;
}
function quickSteps(t){if(t>=5000)return[500,1000,2000];if(t>=1000)return[100,500,1000];if(t>=100)return[10,50,100];if(t>=10)return[1,5,10];return[1];}
function typeLabel(t){return t==='count'?'숫자':t==='log'?'기록':'체크';}
function daysLabel(days){if(days.length===7)return '매일';if(days.join()==='1,2,3,4,5')return '평일';if(days.join()==='0,6')return '주말';return days.slice().sort().map(function(i){return DOW[i];}).join(' ');}

/* ---------- in-page reminders (while the app is open) ---------- */
function dueList(date,hm){
  var out=[];
  state.habits.forEach(function(h){
    if(!activeOn(h,date))return;
    var p=progress(h,date),r=rec(date,h.id);
    var timed=h.slots.map(function(s,i){return {label:s.label,time:s.time,i:i};}).filter(function(s){return s.time;}).sort(function(a,b){return a.time.localeCompare(b.time);});
    timed.forEach(function(s,n){
      if(s.time>hm)return;
      var undone;
      if(h.type==='check')undone=!(r&&r[s.label]);
      else if(h.type==='count')undone=!p.complete;
      else undone=(Array.isArray(r)?r.length:0)<n+1;
      if(undone)out.push({key:date+'|'+h.id+'|'+s.i,time:s.time,title:h.name,sub:s.label,emoji:h.emoji});
    });
  });
  state.events.forEach(function(e){
    if(e.date!==date||!e.time||e.done)return;
    if(e.time<=hm)out.push({key:date+'|ev|'+e.id,time:e.time,title:e.title,sub:'일정',emoji:'📌'});
  });
  return out.sort(function(a,b){return a.time.localeCompare(b.time);});
}
var fired={},banners=[],lastDueSig='',curDay;
function tick(){
  var date=todayStr();
  if(date!==curDay){curDay=date;selDate=date;calMonth=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);render();}
  if(!state.settings.remind)return;
  var hm=nowHM(),nowMin=toMin(hm),due=dueList(date,hm),fresh=[];
  due.forEach(function(d){
    if(fired[d.key])return;
    if(nowMin-toMin(d.time)<=2){fired[d.key]=1;fresh.push(d);}
    else fired[d.key]=1;
  });
  if(fresh.length){
    banners=banners.concat(fresh);
    renderBanners();
    if(state.settings.sound&&!native)beep();
    try{if(!native&&navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
    notify(fresh);
  }
  var sig=due.map(function(d){return d.key;}).join(',');
  if(sig!==lastDueSig){lastDueSig=sig;if(tab==='today'&&!document.activeElement.matches('input,textarea'))render();}
}
function notify(list){
  if(native)return; /* 앱에서는 시스템 알람이 따로 울려요 */
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    list.forEach(function(d){new Notification('초록 하루',{body:d.title+(d.sub?' · '+d.sub:'')+' 시간이에요 ('+d.time+')'});});
  }catch(e){}
}
function renderBanners(){
  var live={};dueList(todayStr(),'23:59').forEach(function(d){live[d.key]=1;});
  banners=banners.filter(function(b){return live[b.key];});
  var el=$('#banners');
  el.innerHTML='<div class="wrap">'+banners.map(function(b){return '<div class="banner"><span>⏰ <b>'+esc(b.title)+'</b>'+(b.sub?' · '+esc(b.sub):'')+' 시간이에요 ('+b.time+')</span><button class="link" data-act="dismiss" data-key="'+esc(b.key)+'">닫기</button></div>';}).join('')+'</div>';
  el.hidden=!banners.length;
}
var actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{
    if(!actx)return;
    var t=actx.currentTime;
    [[880,0],[1175,.18],[1480,.36]].forEach(function(p){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0,t+p[1]);g.gain.linearRampToValueAtTime(.22,t+p[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t+p[1]+.4);
      o.connect(g);g.connect(actx.destination);o.start(t+p[1]);o.stop(t+p[1]+.45);
    });
  }catch(e){}
}

/* ---------- native alarms (안드로이드 앱에서만) ---------- */
var native=null,nativeApp=null,alarmPerm='unknown',exactOk=true,alarmCount=0,appVersion='';
function nativeInit(){
  try{
    var C=window.Capacitor;
    if(!C||typeof C.isNativePlatform!=='function'||!C.isNativePlatform()||typeof C.registerPlugin!=='function')return;
    native=C.registerPlugin('LocalNotifications');
    nativeApp=C.registerPlugin('App');
  }catch(e){native=null;return;}
  document.documentElement.classList.add('native');
  Promise.resolve()
    .then(function(){return native.createChannel({id:'habit-alarm',name:'습관 알람',description:'습관 시간과 일정을 알려 줘요',importance:5,visibility:1,vibration:true,lights:true,lightColor:'#1E8A4B'});}).catch(noop)
    .then(function(){return native.registerActionTypes({types:[{id:'HABIT_CHECK',actions:[{id:'done',title:'완료했어요'}]},{id:'HABIT_OPEN',actions:[{id:'open',title:'기록하기'}]}]});}).catch(noop)
    .then(function(){native.addListener('localNotificationActionPerformed',onNotifAction);})
    .then(checkAlarmPerm)
    .then(function(){if(alarmPerm==='prompt'||alarmPerm==='prompt-with-rationale')return requestAlarmPerm();})
    .then(function(){syncAlarms(true);render();});
  try{
    nativeApp.addListener('backButton',function(){
      if(!$('#sheet').hidden)closeSheet();
      else if(tab!=='today'){tab='today';render();}
      else nativeApp.minimizeApp().catch(noop);
    });
    nativeApp.addListener('appStateChange',function(s){if(s&&s.isActive){tick();}});
    nativeApp.getInfo().then(function(i){appVersion=i&&i.version?i.version:'';}).catch(noop);
  }catch(e){}
}
function checkAlarmPerm(){
  return native.checkPermissions().then(function(r){alarmPerm=r.display;}).catch(function(){alarmPerm='unknown';})
    .then(function(){if(typeof native.checkExactNotificationSetting==='function')return native.checkExactNotificationSetting().then(function(r){exactOk=r.exact_alarm!=='denied';}).catch(noop);});
}
function requestAlarmPerm(){
  return native.requestPermissions().then(function(r){alarmPerm=r.display;}).catch(noop).then(function(){if(tab==='settings')render();});
}
function onNotifAction(ev){
  try{
    var n=ev&&ev.notification,x=(n&&n.extra)||{},act=ev&&ev.actionId;
    if(act==='done'&&x.hid){
      var h=state.habits.find(function(q){return q.id===x.hid;}),date=todayStr();
      if(h&&h.type==='check'){var r=Object.assign({},rec(date,h.id)||{});r[x.slot]=true;setRec(date,h.id,r);toast((h.emoji?h.emoji+' ':'')+h.name+' 완료!');}
    }
    tab='today';render();
  }catch(e){}
}
function hashId(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return (Math.abs(h)%2000000000)+1;}
function buildAlarms(){
  var list=[],today=todayStr(),now=Date.now();
  if(state.settings.alarm===false)return list;
  state.habits.forEach(function(h){
    if(h.alarm===false)return;
    h.slots.forEach(function(s,si){
      if(!s.time)return;
      var p=s.time.split(':').map(Number);
      var title=(h.emoji?h.emoji+' ':'')+h.name+(s.label&&s.label!=='완료'?' · '+s.label:'');
      var body=h.type==='check'?'지금 체크해요':h.type==='count'?'오늘 목표 '+fmtNum(h.target)+(h.unit||'')+' 채웠나요?':'지금 기록해요';
      var base={title:title,body:body,channelId:'habit-alarm',actionTypeId:h.type==='check'?'HABIT_CHECK':'HABIT_OPEN',extra:{hid:h.id,slot:s.label,type:h.type},autoCancel:true};
      if(h.days.length===7)list.push(Object.assign({id:hashId(h.id+'|'+si+'|all'),schedule:{on:{hour:p[0],minute:p[1]},allowWhileIdle:true}},base));
      else h.days.forEach(function(d){list.push(Object.assign({id:hashId(h.id+'|'+si+'|'+d),schedule:{on:{weekday:d+1,hour:p[0],minute:p[1]},allowWhileIdle:true}},base));});
    });
  });
  state.events.forEach(function(e){
    if(e.done||e.date<today)return;
    var d=parseDate(e.date);
    if(e.time){
      var p=e.time.split(':').map(Number),at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),p[0],p[1]);
      if(at.getTime()>now)list.push({id:hashId('ev|'+e.id+'|at'),title:'📌 '+e.title,body:e.time+(e.note?' · '+e.note:''),schedule:{at:at,allowWhileIdle:true},channelId:'habit-alarm',actionTypeId:'HABIT_OPEN',extra:{eid:e.id},autoCancel:true});
    }
    var eve=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,20,0);
    if(eve.getTime()>now)list.push({id:hashId('ev|'+e.id+'|eve'),title:'내일 일정: '+e.title,body:kDate(e.date,true)+(e.time?' '+e.time:'')+(e.note?' · '+e.note:''),schedule:{at:eve,allowWhileIdle:true},channelId:'habit-alarm',actionTypeId:'HABIT_OPEN',extra:{eid:e.id},autoCancel:true});
  });
  return list;
}
var syncTimer=null;
function syncAlarms(now){if(!native)return;clearTimeout(syncTimer);syncTimer=setTimeout(doSyncAlarms,now?0:600);}
function doSyncAlarms(){
  if(!native)return;
  native.getPending().then(function(r){var ids=((r&&r.notifications)||[]).map(function(n){return {id:n.id};});return ids.length?native.cancel({notifications:ids}):null;}).catch(noop)
    .then(function(){var list=buildAlarms();alarmCount=list.length;return list.length?native.schedule({notifications:list}):null;})
    .catch(function(e){console.log('alarm sync error',e&&e.message);})
    .then(function(){var el=$('#alarm-count');if(el)el.textContent=alarmCountText();});
}

}

function renderCal(){
  var y=calMonth.getFullYear(),m=calMonth.getMonth(),lead=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=todayStr();
  var cells='',full=0,evc=0;
  for(var i=0;i<lead;i++)cells+='<div class="day blank"></div>';
  for(var d=1;d<=days;d++){
    var s=fmtDate(new Date(y,m,d)),sum=daySummary(s),evs=state.events.filter(function(e){return e.date===s;});
    evc+=evs.length;
    var future=s>today,isFull=!future&&sum.total>0&&sum.done===sum.total;
    if(isFull)full++;
    cells+='<button class="day'+(s===today?' today':'')+(s===selDate?' sel':'')+(future?' future':'')+'" data-act="calsel" data-date="'+s+'" aria-label="'+kDate(s,true)+'"><span class="dn '+(isFull?'full':(sum.done>0?'part':''))+'" style="--deg:'+Math.round(sum.ratio*360)+'deg"><span>'+d+'</span></span>'+(evs.length?'<i class="evdot'+(evs.every(function(e){return e.done;})?' done':'')+'"></i>':'')+'</button>';
  }
  var h='<div class="calhead"><h1>'+y+'년 '+(m+1)+'월</h1><div class="nav"><button data-act="calprev" aria-label="이전 달">‹</button><button class="link" data-act="caltoday">오늘</button><button data-act="calnext" aria-label="다음 달">›</button></div></div>';
  h+='<div class="calgrid">'+DOW.map(function(x){return '<div class="dow">'+x+'</div>';}).join('')+cells+'</div>';
  h+='<div class="calsum"><span class="legend"><i style="background:var(--green)"></i>모두 달성 '+full+'일</span><span class="legend"><i style="background:var(--amber)"></i>일정 '+evc+'개</span></div>';
  var sel=selDate,ssum=daySummary(sel),sevs=state.events.filter(function(e){return e.date===sel;}).sort(byTime),shabits=state.habits.filter(function(x){return activeOn(x,sel);}),isFuture=sel>today;
  h+='<div class="panel"><div class="ph"><h2>'+kDate(sel,true)+(sel===today?' · 오늘':'')+'</h2><button class="chip" data-act="newevent" data-date="'+sel+'">+ 일정</button></div>';
  if(sevs.length)h+='<div class="evlist" style="margin-bottom:12px">'+sevs.map(function(e){return evRow(e,false);}).join('')+'</div>';
  else h+='<p class="hint" style="margin:0 0 12px">이 날 일정이 없어요.</p>';
  if(isFuture)h+='<p class="hint">습관 체크는 그 날이 되면 할 수 있어요.</p>';
  else if(shabits.length){
    h+='<p class="hint" style="margin-bottom:8px">습관 '+ssum.done+'/'+ssum.total+' 달성 · 빠뜨린 기록은 여기서 채울 수 있어요.</p>';
    h+=shabits.map(function(x){return habitCard(x,sel);}).join('');
  }else h+='<p class="hint">이 날은 정해진 습관이 없어요.</p>';
  h+='</div>';
  return h;
}

function currentFormType(){var r=document.querySelector('input[name=hf-type]:checked');return r?r.value:'check';}

function saveHabitForm(form){
  var name=$('#hf-name').value.trim();
  if(!name){toast('이름을 적어 주세요');$('#hf-name').focus();return;}
  var type=currentFormType();
  var slots=formSlots.map(function(s){return {label:s.label.trim(),time:s.time};}).filter(function(s){return s.label||s.time;});
  if(type==='check'){
    var seen={};
    slots=slots.map(function(s,i){var l=s.label||(i+1)+'번째';var base=l,k=2;while(seen[l]){l=base+' '+k++;}seen[l]=1;return {label:l,time:s.time};});
    if(!slots.length)slots=[{label:'완료',time:''}];
  }else slots=slots.filter(function(s){return s.time;});
  var days=ALL.filter(function(i){return $('#hf-day-'+i).checked;});
  if(!days.length)days=ALL.slice();
  var target=1,unit='',options=[];
  if(type==='count'){target=Math.max(1,Number($('#hf-target').value)||1);unit=$('#hf-unit').value.trim();}
  if(type==='log'){target=Math.max(1,Number($('#hf-logtarget').value)||1);options=$('#hf-options').value.split(/[,，、]/).map(function(x){return x.trim();}).filter(Boolean).slice(0,8);}
  var id=form.dataset.id,obj;
  if(id){obj=state.habits.find(function(x){return x.id===id;});}
  if(!obj){obj={id:uid(),createdAt:todayStr()};state.habits.push(obj);}
  var alarmEl=$('#hf-alarm');
  Object.assign(obj,{name:name,emoji:$('#hf-emoji').value.trim(),type:type,slots:slots,target:target,unit:unit,options:options,days:days,alarm:alarmEl?alarmEl.checked:(obj.alarm!==false)});
  save(true);closeSheet();render();toast(id?'습관을 고쳤어요':'새 습관을 만들었어요');
}

}
function saveEventForm(form){
  var title=$('#ef-title').value.trim(),date=$('#ef-date').value;
  if(!title){toast('제목을 적어 주세요');return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){toast('날짜를 골라 주세요');return;}
  var id=form.dataset.id,e=id?state.events.find(function(x){return x.id===id;}):null;
  if(!e){e={id:uid(),done:false};state.events.push(e);}
  Object.assign(e,{title:title,date:date,time:$('#ef-time').value||'',note:$('#ef-note').value.trim()});
  save(true);closeSheet();
  if(tab==='cal'){selDate=date;calMonth=new Date(parseDate(date).getFullYear(),parseDate(date).getMonth(),1);}
  render();toast(id?'일정을 고쳤어요':'일정을 추가했어요');
}
function needConfirm(btn,label){
  if(btn.dataset.confirm==='1')return true;
  btn.dataset.confirm='1';btn.dataset.orig=btn.textContent;btn.textContent=label||'한 번 더 누르면 삭제';btn.classList.add('confirming');
  setTimeout(function(){if(btn.isConnected&&btn.dataset.confirm==='1'){btn.dataset.confirm='';btn.textContent=btn.dataset.orig;btn.classList.remove('confirming');}},3500);
  return false;
}

/* ---------- actions ---------- */
function onAction(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var d=el.dataset,act=d.act,h;
  switch(act){
    case 'tab':case 'gotab':tab=d.tab;$('#view').scrollTop=0;render();break;
    case 'welcomeclose':state.welcomed=true;save();render();break;
    case 'toggle':{
      var r=Object.assign({},rec(d.date,d.hid)||{});
      if(r[d.slot])delete r[d.slot];else r[d.slot]=true;
      setRec(d.date,d.hid,Object.keys(r).length?r:null);
      h=state.habits.find(function(x){return x.id===d.hid;});
      render();
      if(h&&progress(h,d.date).complete)toast((h.emoji?h.emoji+' ':'')+h.name+' 완료!');
      break;}
    case 'addcount':{
      var cur=Number(rec(d.date,d.hid)||0),nv=d.n==='reset'?0:cur+Number(d.n);
      setRec(d.date,d.hid,nv||null);h=state.habits.find(function(x){return x.id===d.hid;});
      var was=cur>=(h?h.target:1);render();
      if(h&&!was&&nv>=h.target)toast((h.emoji?h.emoji+' ':'')+h.name+' 목표 달성!');
      break;}
    case 'addlog':{
      var arr=(rec(d.date,d.hid)||[]).slice(),ti=$('#lt-'+d.hid+'-'+d.date),t=ti?ti.value:'';
      arr.push({t:t,v:d.v});arr.sort(function(a,b){return (a.t||'99').localeCompare(b.t||'99');});
      setRec(d.date,d.hid,arr);render();break;}
    case 'dellog':{
      var a2=(rec(d.date,d.hid)||[]).slice();a2.splice(Number(d.i),1);
      setRec(d.date,d.hid,a2.length?a2:null);render();break;}
    case 'evdone':{
      var e=state.events.find(function(x){return x.id===d.id;});
      if(e){e.done=!e.done;save(true);render();}
      break;}
    case 'newevent':openEventForm(null,d.date);break;
    case 'editevent':openEventForm(d.id);break;
    case 'evdel':
      if(!needConfirm(el))break;
      state.events=state.events.filter(function(x){return x.id!==d.id;});save(true);closeSheet();render();toast('일정을 지웠어요');break;
    case 'calprev':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()-1,1);render();break;
    case 'calnext':calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+1,1);render();break;
    case 'caltoday':selDate=todayStr();calMonth=new Date(parseDate(selDate).getFullYear(),parseDate(selDate).getMonth(),1);render();break;
    case 'calsel':selDate=d.date;render();break;
    case 'newhabit':openHabitForm(null);break;
    case 'edithabit':openHabitForm(d.id);break;
    case 'delhabit':
      if(!needConfirm(el,'정말 삭제'))break;
      state.habits=state.habits.filter(function(x){return x.id!==d.id;});
      Object.keys(state.records).forEach(function(k){delete state.records[k][d.id];});
      save(true);render();toast('습관을 지웠어요');break;
    case 'togglealarm':{
      h=state.habits.find(function(x){return x.id===d.id;});
      if(!h)break;
      h.alarm=h.alarm===false;save(true);render();
      toast(h.alarm?(h.emoji?h.emoji+' ':'')+h.name+' 알람을 켰어요':(h.emoji?h.emoji+' ':'')+h.name+' 알람을 껐어요');
      break;}
    case 'move':{
      var i=state.habits.findIndex(function(x){return x.id===d.id;}),j=i+Number(d.dir);
      if(i<0||j<0||j>=state.habits.length)break;
      var tmp=state.habits[i];state.habits[i]=state.habits[j];state.habits[j]=tmp;save();render();break;}
    case 'closesheet':closeSheet();break;
    case 'slotadd':formSlots.push({label:d.label,time:d.time});refreshSlotRows();if(!d.label){var last=$('#hf-slot-label-'+(formSlots.length-1));if(last)last.focus();}break;
    case 'slotdel':formSlots.splice(Number(d.i),1);refreshSlotRows();break;
    case 'dismiss':banners=banners.filter(function(b){return b.key!==d.key;});renderBanners();break;
    case 'testsound':unlockAudio();beep();toast('이런 소리로 알려 드려요');break;
    case 'testalarm':testAlarm();break;
    case 'alarmperm':if(native)requestAlarmPerm().then(function(){syncAlarms(true);});break;
    case 'exactalarm':if(native&&typeof native.changeExactNotificationSetting==='function')native.changeExactNotificationSetting().then(function(r){exactOk=r.exact_alarm!=='denied';render();}).catch(noop);break;
    case 'notifperm':
      try{
        if(!('Notification' in window)){toast('이 브라우저는 알림을 지원하지 않아요');break;}
        Notification.requestPermission().then(function(p){toast(p==='granted'?'브라우저 알림을 허용했어요':'허용되지 않았어요. 화면 알림은 계속 돼요');}).catch(function(){toast('여기서는 허용할 수 없어요. 화면 알림은 계속 돼요');});
      }catch(e){toast('여기서는 허용할 수 없어요. 화면 알림은 계속 돼요');}
      break;
    case 'copybackup':{
      var txt=JSON.stringify(state);
      var ta=$('#restore-text');
      var fallback=function(){if(ta){ta.value=txt;ta.focus();ta.select();}toast('아래 칸의 글을 길게 눌러 복사하세요');};
      try{navigator.clipboard.writeText(txt).then(function(){toast('백업을 복사했어요. 메모장 등에 붙여넣어 보관하세요');},fallback);}catch(e){fallback();}
      break;}
    case 'reseed':{
      var s=sample(),names=state.habits.map(function(x){return x.name;}),added=0;
      s.habits.forEach(function(x){if(names.indexOf(x.name)<0){state.habits.push(x);added++;}});
      save(true);render();toast(added?'예시 습관 '+added+'개를 넣었어요':'예시 습관이 이미 다 있어요');break;}
    case 'wipe':
      if(!needConfirm(el,'정말 모두 지우기'))break;
      state=defaults();var sm=sample();state.habits=sm.habits;state.events=sm.events;normalize();save(true);tab='today';render();toast('처음 상태로 돌아갔어요');break;
  }
}
function onSubmit(ev){
  var f=ev.target;
  ev.preventDefault();
  if(f.id==='habit-form')saveHabitForm(f);
  else if(f.id==='event-form')saveEventForm(f);
  else if(f.dataset.act==='setcount'){
    var inp=f.querySelector('input'),v=Math.max(0,Number(inp.value)||0),h=state.habits.find(function(x){return x.id===f.dataset.hid;});
    var was=Number(rec(f.dataset.date,f.dataset.hid)||0)>=(h?h.target:1);
    setRec(f.dataset.date,f.dataset.hid,v||null);render();
    if(h&&!was&&v>=h.target)toast((h.emoji?h.emoji+' ':'')+h.name+' 목표 달성!');else toast('저장했어요');
  }
  else if(f.id==='restore-form'){
    var txt=$('#restore-text').value.trim();
    if(!txt){toast('붙여넣은 내용이 없어요');return;}
    try{
      var obj=JSON.parse(txt);
      if(!obj||!Array.isArray(obj.habits))throw new Error('bad');
      state=Object.assign(defaults(),obj);normalize();save(true);render();toast('복원했어요');
    }catch(e){toast('백업 글이 아닌 것 같아요. 복사한 전체를 붙여넣어 주세요');}
  }
}
function onChange(ev){
  var t=ev.target;
  if(t.name==='hf-type'){var ty=t.value;$('#hf-count').hidden=ty!=='count';$('#hf-log').hidden=ty!=='log';refreshSlotRows();return;}
  if(t.id==='set-remind'){state.settings.remind=t.checked;save();if(!t.checked){banners=[];renderBanners();}return;}
  if(t.id==='set-sound'){state.settings.sound=t.checked;save();return;}
  if(t.id==='set-alarm'){state.settings.alarm=t.checked;save(true);var el=$('#alarm-count');if(el)el.textContent=alarmCountText();toast(t.checked?'알람을 켰어요':'알람을 모두 껐어요');return;}
  if(t.id==='set-name'){state.settings.name=t.value.trim();save();toast('저장했어요');return;}
}
function onInput(ev){
  var t=ev.target;
  if(t.dataset.slotLabel!=null&&formSlots[+t.dataset.slotLabel])formSlots[+t.dataset.slotLabel].label=t.value;
  if(t.dataset.slotTime!=null&&formSlots[+t.dataset.slotTime])formSlots[+t.dataset.slotTime].time=t.value;
}

/* ---------- boot ---------- */
load();
curDay=todayStr();selDate=curDay;calMonth=new Date(parseDate(curDay).getFullYear(),parseDate(curDay).getMonth(),1);
document.addEventListener('click',onAction);
document.addEventListener('submit',onSubmit);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);
document.addEventListener('pointerdown',unlockAudio);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});
render();
nativeInit();
tick();
setInterval(tick,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>
<!-- app:end -->
